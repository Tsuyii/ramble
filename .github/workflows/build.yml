name: build

# Builds the Tauri desktop installers in the cloud (no Smart App Control there),
# so they can be produced without building locally. Bundles the Node server as a
# self-contained sidecar binary, smoke-tests it, then packages the installers.
# Artifacts are downloadable from each run. See ADR-0002.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Node server sidecar
        shell: bash
        run: |
          set -euo pipefail
          npm run bundle:server
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""; [ "$TRIPLE" = "x86_64-pc-windows-msvc" ] && EXT=".exe"
          mkdir -p src-tauri/binaries
          # Ship the runner's own Node as the sidecar runtime (deterministic — no
          # downloading/compiling a base binary). The bundled server.cjs runs on it.
          NODEBIN=$(node -e "process.stdout.write(process.execPath)")
          cp "$NODEBIN" "src-tauri/binaries/ramble-server-$TRIPLE$EXT"
          chmod +x "src-tauri/binaries/ramble-server-$TRIPLE$EXT" || true
          ls -la src-tauri/binaries dist

      - name: Smoke-test sidecar (runs the real binary — no SAC here)
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""; [ "$TRIPLE" = "x86_64-pc-windows-msvc" ] && EXT=".exe"
          BIN="src-tauri/binaries/ramble-server-$TRIPLE$EXT"
          RAMBLE_PUBLIC_DIR=public PORT=5199 "$BIN" dist/server.cjs &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5199/api/health >/dev/null 2>&1; then OK=1; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5199/api/health && echo " — sidecar OK"
          kill "$PID" 2>/dev/null || true
          [ "${OK:-0}" = "1" ] || { echo "sidecar smoke test failed"; exit 1; }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble portable app (no installer — run Ramble.exe directly)
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          OUT="portable/Ramble"
          mkdir -p "$OUT"
          cp src-tauri/target/release/app.exe "$OUT/Ramble.exe"
          cp "src-tauri/binaries/ramble-server-$TRIPLE.exe" "$OUT/ramble-server.exe"
          cp dist/server.cjs "$OUT/server.cjs"
          cp -r public "$OUT/public"
          ls -R "$OUT"

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: ramble-portable
          path: portable/**

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ramble-windows
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
