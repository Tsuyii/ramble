name: ci

# Runs the Playwright E2E suite on every push and PR. The suite boots its own dev
# server via the webServer block in playwright.config.js; in CI reuseExistingServer
# is off (gated on the CI env var), so each run starts a clean server. The HTML
# report is uploaded as an artifact when the suite fails, for post-mortem triage.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
